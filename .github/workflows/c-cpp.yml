name: C Build & Run Check

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build-and-run:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Install GCC
        run: sudo apt-get update && sudo apt-get install -y build-essential

      - name: Compile and run C files
        run: |
          set -e
          echo "Searching for C files..."
          find . -name "*.c" > c_files.txt
          echo "Files found:"
          cat c_files.txt
          echo "--------------------------------"

          while read file; do
            exe="/tmp/$(basename "$file" .c)"
            echo "Compiling $file -> $exe"
            gcc "$file" -o "$exe"

            echo "Running $exe"
            # Run with a timeout to avoid hanging on programs that wait for input
            timeout 2s "$exe" || echo "Program finished or required input"
            echo "SUCCESS: $file compiled and executed"
            echo "--------------------------------"
          done < c_files.txt
