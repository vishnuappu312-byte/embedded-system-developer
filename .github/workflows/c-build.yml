name: C Code Check

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Install GCC
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential

    - name: Find and Compile All C Files
      run: |
        find . -name "*.c" -print0 | while IFS= read -r -d '' file
        do
          echo "Checking: $file"
          gcc -Wall -Wextra -Werror -c "$file" -o /tmp/test.o
        donename: C Code Check

